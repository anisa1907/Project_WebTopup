services:
  app:
    image: nginx:alpine
    container_name: project-app
    ports:
      - "5000:80"
    volumes:
      - ./logs:/app/logs

  db:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: projectdb
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data: