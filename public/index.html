<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WebTopup</title>

    <link rel="stylesheet" href="/src/css/style.css">
</head>


<body>

<header>

    <div class="logo">
        WebTopup
    </div>


    <nav>
        <a href="#">Home</a>
        <a href="#">Top Up</a>
        <a href="#">Riwayat</a>
        <a href="#">Login</a>
    </nav>

</header>



<section class="hero">


    <div class="hero-text">

        <h1>
            Top Up Game Favoritmu
        </h1>


        <p>
            Proses cepat, aman, dan terpercaya.
        </p>


        <button>
            Mulai Top Up
        </button>

    </div>



    <div class="hero-image">

        <img src="/assets/game.jpg" alt="Game">

    </div>


</section>





<section class="games">


<h2>
    Pilih Game Favorit
</h2>


<p id="status">
    Menunggu data game...
</p>



<div class="game-card" id="game-list">


    <div class="card">

        <img src="/assets/ml.jpg" alt="Mobile Legends">

        <h3>
            Mobile Legends
        </h3>

        <button>
            Top Up Sekarang
        </button>

    </div>



    <div class="card">

        <img src="/assets/ff.jpg" alt="Free Fire">

        <h3>
            Free Fire
        </h3>

        <button>
            Top Up Sekarang
        </button>

    </div>




    <div class="card">

        <img src="/assets/pubg.jpg" alt="PUBG">

        <h3>
            PUBG Mobile
        </h3>

        <button>
            Top Up Sekarang
        </button>

    </div>



</div>


</section>


</body>

</html>
